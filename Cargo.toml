[package]
name = "nanochat-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A small, local Rust implementation of the nanochat training pipeline"

[dependencies]
anyhow = "1"
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = { version = "0.9", features = ["metal"] }
clap = { version = "4", features = ["derive"] }
rand = "0.9"
safetensors = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
approx = "0.5"
